# ESPHome 密钥模板。复制成 secrets.yaml 再填写；secrets.yaml 不会进 git。
#   cp secrets.example.yaml secrets.yaml

# WiFi 只支持 2.4GHz
wifi_ssid: "改成你的WiFi名称"
wifi_password: "改成你的WiFi密码"

# 加密密钥：32 字节 base64，用 `openssl rand -base64 32` 生成。
# HA 接入主控时要填这个；换了密钥要重新烧录，HA 里也要重新填。
api_key: "用 openssl rand -base64 32 生成"

# 连不上 WiFi 时主控开的热点「A1BOX-Setup」的密码，至少 8 位
ap_password: "改成随机密码"
